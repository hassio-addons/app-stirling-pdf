proxy_http_version          1.1;
proxy_ignore_client_abort   off;
proxy_read_timeout          86400s;
proxy_send_timeout          86400s;
proxy_max_temp_file_size    0;

# A PDF goes up and comes back down whole. Buffering either direction would
# put the file through a temporary file on disk first, for no gain.
proxy_buffering             off;
proxy_request_buffering     off;

# The page has to arrive uncompressed, or the Ingress rewrite below would be
# looking at gzip rather than at the document.
proxy_set_header Accept-Encoding "";

proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $http_host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;
